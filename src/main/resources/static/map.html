<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>휴게소 길찾기</title>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=앱키"></script>
</head>
<body>
    <div id="map" style="width:100%;height:800px;"></div>
    <button onclick="findRoute()">길찾기 & 휴게소 찾기</button>

    <script>
        var mapContainer = document.getElementById('map'),
            mapOption = { center: new kakao.maps.LatLng(36.5, 127.5), level: 12 };
        var map = new kakao.maps.Map(mapContainer, mapOption);

        function findRoute() {
            // 긴 경로 테스트 (서울역 -> 부산역 좌표 예시)
            const origin = "126.9723,37.5559";
            const destination = "129.0393,35.1144";

            fetch(`/api/navi?origin=${origin}&destination=${destination}`)
                .then(res => res.json())
                .then(data => {
                    const linePath = [];
                    // 1. 선 그리기용 좌표 수집
                    data.fullRoute.routes[0].sections.forEach(section => {
                        section.roads.forEach(road => {
                            road.vertexes.forEach((v, i) => {
                                if(i % 2 === 0) linePath.push(new kakao.maps.LatLng(road.vertexes[i+1], v));
                            });
                        });
                    });

                    new kakao.maps.Polyline({
                        path: linePath, strokeWeight: 5, strokeColor: '#FF0000', strokeOpacity: 0.7, map: map
                    });

                    // 2. 추출된 휴게소 마커 찍기
                    data.restAreas.forEach(area => {
                        var marker = new kakao.maps.Marker({
                            position: new kakao.maps.LatLng(area.y, area.x),
                            map: map
                        });
                        var infowindow = new kakao.maps.InfoWindow({ content: `<div style="padding:5px;">${area.name}</div>` });
                        kakao.maps.event.addListener(marker, 'click', () => infowindow.open(map, marker));
                    });

                    // 지도 범위 조정
                    var bounds = new kakao.maps.LatLngBounds();
                    linePath.forEach(p => bounds.extend(p));
                    map.setBounds(bounds);
                });
        }
        function findRoute() {
    console.log("버튼 클릭됨!"); // 1단계 체크
    const origin = "126.9723,37.5559";
    const destination = "129.0393,35.1144";

    fetch(`/api/navi?origin=${origin}&destination=${destination}`)
        .then(res => {
            console.log("서버 응답 상태:", res.status); // 2단계 체크
            return res.json();
        })
        .then(data => {
            console.log("받은 데이터:", data); // 3단계 체크
            if (!data.fullRoute || data.fullRoute.routes[0].result_code !== 0) {
                alert("길찾기 실패: " + (data.fullRoute ? data.fullRoute.routes[0].result_msg : "데이터 없음"));
                return;
            }
            // ... 이하 기존 코드
        })
        .catch(err => console.error("통신 에러:", err));
}
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Music Carousel</title>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; }
        .carousel { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 50px; }
        iframe { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .btn { padding: 15px; cursor: pointer; background: #ff0000; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎧 [[${keyword}]] 음악 플레이리스트</h1>
    <div class="carousel">
        <button class="btn" onclick="move(-1)">◀</button>
        <div id="player">
            <iframe id="yt-frame" width="640" height="360" src="" frameborder="0" allowfullscreen></iframe>
            <h3 id="pl-title" style="margin-top:20px;"></h3>
        </div>
        <button class="btn" onclick="move(1)">▶</button>
    </div>
<form action="/music/search" method="get">
    <input type="text" name="q" placeholder="새로운 음악 키워드 입력 (예: 재즈, 운동)">
    <button type="submit">유튜브에서 추가하기</button>
</form>

<hr>

<div class="carousel">
    <div th:each="pl : ${playlists}">
        <p th:text="${pl.title}">제목</p>
        <a th:href="'https://www.youtube.com/playlist?list=' + ${pl.playlistId}" target="_blank">듣기</a>
    </div>
</div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const list = /*[[${playlists}]]*/ [];
        let idx = 0;

        function update(n) {
            if (list.length === 0) return;
            const item = list[n];
            document.getElementById('yt-frame').src = `https://www.youtube.com/embed/videoseries?list=${item.playlistId}`;
            document.getElementById('pl-title').innerText = item.title;
        }

        function move(dir) {
            idx = (idx + dir + list.length) % list.length;
            update(idx);
        }

        window.onload = () => update(0);
        /*]]>*/
    </script>
</body>
</html>

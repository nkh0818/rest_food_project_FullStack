spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rest_food_db?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:               #커넥션 풀
          max-active: 10
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id:
            client-secret:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  


logging:
  level:
    com.yonsai.rest_food_project: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.type.descriptor.sql: trace

# 공공데이터 API 키 등 커스텀 설정
road-service-key: ${ROAD_SERVICE_KEY}
YoutubeKey: asd
kakaoNaviKey: ${KAKAO_NAVI_KEY}
# kakao
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}
  client-secret: ${KAKAO_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}

nickname:
  adjectives: 배고픈,바삭한,졸린,질주하는,짭짤한
  nouns: 호두과자,소떡소떡,알감자,델리만쥬,통감자,오징어

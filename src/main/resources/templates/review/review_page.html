<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>리뷰 페이지</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.star {
    font-size: 30px;
    cursor: pointer;
    color: lightgray;
}

.tag-container { margin-bottom: 10px; }

.tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}

.tag-btn {
    padding: 6px 12px;
    border: 1px solid #ccc;
    background-color: white;
    cursor: pointer;
    border-radius: 20px;
}

.tag-btn.active {
    background-color: #3B82F6;
    color: white;
    border: none;
}

#tagInput {
    padding: 6px;
    width: 200px;
}

.hash-tag {
    display: inline-block;
    padding: 6px 12px;
    margin: 3px;
    background-color: #f1f1f1;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.hash-tag:hover {
    background-color: #ffdddd;
}

.review-card {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
}

.modal-content {
    background: white;
    padding: 20px;
    margin: 15% auto;
    width: 300px;
    border-radius: 10px;
    text-align: center;
}

.review-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
}

.edit-btn {
    padding: 6px 12px;
    border: none;
    background-color: #4CAF50;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.edit-btn:hover {
    background-color: #45a049;
}

.delete-btn {
    padding: 6px 12px;
    border: none;
    background-color: #ff4d4d;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.delete-btn:hover {
    background-color: #e60000;
}

.custom-alert {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
}

.alert-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    width: 250px;
}

.alert-box button {
    margin-top: 10px;
    padding: 6px 12px;
    border: none;
    background-color: #4CAF50;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.inquiry-card {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    background-color: #fafafa;
}

</style>
</head>

<body>

<h1>리뷰 페이지</h1>

<h3>리뷰 작성</h3>

<div id="starRating">
    <span class="star" data-value="1">☆</span>
    <span class="star" data-value="2">☆</span>
    <span class="star" data-value="3">☆</span>
    <span class="star" data-value="4">☆</span>
    <span class="star" data-value="5">☆</span>
</div>

<br>

<div class="tag-container">
<div class="tag-list">
    <span class="tag-btn" onclick="selectBaseTag('맛있어요', this)">맛있어요</span>
    <span class="tag-btn" onclick="selectBaseTag('별로', this)">별로</span>
    <span class="tag-btn" onclick="selectBaseTag('양 많음', this)">양 많음</span>
    <span class="tag-btn" onclick="selectBaseTag('청결해요', this)">깨끗해요</span>
</div>

<input type="text" id="tagInput" placeholder="태그 입력 후 Enter" onkeydown="handleTagInput(event)">
<div id="selectedTags"></div>
</div>

<br>

<input type="text" id="content" placeholder="리뷰 내용을 입력하세요">

<br>
<br>

<input type="file" id="image" accept="image/*">
<p style="font-size: 12px; color: gray;">사진을 업로드하세요 (선택사항)</p>

<button onclick="submitReview()">리뷰 작성</button>

<hr>

<h3>리뷰 목록</h3>
<div id="reviewList"></div>

<div id="rewardPopup" class="modal">
    <div class="modal-content">
        <h3>포인트 안내</h3>
        <p>리뷰 작성 시 포인트를 받을 수 있어요!</p>
        <p>커피 할인 쿠폰</p>
        <p>휴게소 할인 쿠폰</p>
        <button onclick="closeRewardPopup()">닫기</button>
    </div>
</div>

<div id="customAlert" class="custom-alert">
    <div class="alert-box">
        <p id="alertMessage"></p>
        <button onclick="closeAlert()">확인</button>
    </div>
</div>

<hr>

<h3>문의하기</h3>

<input type="text" id="inquiryContent" placeholder="문의 내용을 입력하세요">
<button onclick="submitInquiry()">문의 보내기</button>

<div id="inquiryList"></div>

<script>
const BASE_URL = "http://localhost:8080";
const restAreaId = 1;
const currentUserId = 1;

let selectedRating = 0;
let selectedTags = [];

window.onload = function() {
    initStars();
    loadReviews();
    loadInquiries();
    document.getElementById("rewardPopup").style.display = "block";
};

// 리뷰 작성 완료 시 별점 초기화
function initStars() {
    document.querySelectorAll(".star").forEach(star => {
        star.addEventListener("click", function() {
            const clickedValue = Number(this.dataset.value);

            if (selectedRating === clickedValue) {
                selectedRating = Math.max(1, clickedValue - 1);
            } else {
                selectedRating = clickedValue;
            }

            highlightStars(selectedRating);
        });
    });
}

function highlightStars(rating) {
    document.querySelectorAll(".star").forEach((star, i) => {
        star.textContent = i < rating ? "★" : "☆";
        star.style.color = i < rating ? "gold" : "lightgray";
    });
}

function selectBaseTag(tag, el) {
    if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(t => t !== tag);
        el.classList.remove("active");
    } else {
        selectedTags.push(tag);
        el.classList.add("active");
    }
    renderTags();
}

function handleTagInput(e) {
    if (e.key === "Enter") {
        const input = document.getElementById("tagInput");
        const tag = input.value.trim();

        if (tag && !selectedTags.includes(tag)) {
            selectedTags.push(tag);
            renderTags();
        }
        input.value = "";
    }
}

function renderTags() {
    document.getElementById("selectedTags").innerHTML =
        selectedTags.map(t =>
            `<span class="hash-tag" onclick="removeTag('${t}')">#${t}</span>`
        ).join("");
}

function removeTag(tag) {
    selectedTags = selectedTags.filter(t => t !== tag);

    document.querySelectorAll(".tag-btn").forEach(btn => {
        if (btn.textContent.includes(tag)) {
            btn.classList.remove("active");
        }
    });

    renderTags();
}

function closeRewardPopup() {
    document.getElementById("rewardPopup").style.display = "none";
    const imageFile = document.getElementById("image").files[0];
}

// 리뷰 작성
function submitReview() {
    const content = document.getElementById("content").value;

    if (!selectedRating || !content) {
        alert("별점과 내용을 입력하세요");
        return;
    }
    
    const formData = new FormData();

    formData.append("restAreaId", restAreaId);
    formData.append("rating", selectedRating);
    formData.append("content", content);

    selectedTags.forEach(tag => formData.append("tags", tag));
    
    // 이미지 있을 때만
    if (imageFile) {
        formData.append("image", imageFile);
    }

    fetch(`${BASE_URL}/api/reviews`, {
        method: "POST",
        body: formData
    })
    .then(res => {
        if (!res.ok) throw new Error("작성 실패");
        return res;
    })
    .then(() => {
        showAlert("리뷰 작성이 완료되었습니다.");

        document.getElementById("content").value = "";
        document.getElementById("image").value = "";
        
        selectedTags = [];
        renderTags();
        selectedRating = 0;
        highlightStars(0);

        loadReviews();
        window.scrollTo(0, 0);
    })
    .catch(err => {
        console.error(err);
        alert("에러 발생");
    });
}

// 리뷰 목록 조회 + 이미지 출력
function loadReviews() {
    fetch(`${BASE_URL}/api/reviews/rest-area/${restAreaId}`)
    .then(res => res.json())
    .then(data => {
        document.getElementById("reviewList").innerHTML =
            data.map(r => `
                <div class="review-card">
                    <p><strong>${r.nickname}</strong></p>
                    <p>${"★".repeat(r.rating)}</p>
                    <p>${r.content}</p>

                    ${r.imageUrl ? `<img src="${r.imageUrl}" style="width:100%; max-height:200px;">` : ""}
                </div>
            `).join("");
    });
}

// 삭제
function deleteReview(id) {
    if (!confirm("삭제하시겠습니까?")) return;

    fetch(`${BASE_URL}/api/reviews/${id}`, {
        method: "DELETE"
    })
    .then(() => {
        alert("삭제 완료");
        loadReviews();
    });
}

function showAlert(message) {
    document.getElementById("alertMessage").innerText = message;
    document.getElementById("customAlert").style.display = "flex";
}

function closeAlert() {
    document.getElementById("customAlert").style.display = "none";
}

function goEdit(reviewId) {
    location.href = `/review/edit?id=${reviewId}`;
}

//좋아요 추가
function likeReview(reviewId) {
    fetch(`${BASE_URL}/api/reviews/${reviewId}/like`, {
        method: "POST",
    })
    .then(res => {
        if (!res.ok) throw new Error("좋아요 실패");
        return res;
    })
    .then(() => loadReviews())
    .catch(err => {
        console.error(err);
        alert("더이상  좋아요를 누를 수 없습니다!");
    });
}

// 좋아요 취소
function unlikeReview(reviewId) {
    fetch(`${BASE_URL}/api/reviews/${reviewId}/like`, {
        method: "DELETE",
    })
    .then(() => loadReviews());
}

// 문의 보내기
function submitInquiry() {
    const content = document.getElementById("inquiryContent").value;

    if (!content || content.trim().length < 5) {
        alert("문의는 5자 이상 입력해주세요");
        return;
    }

    fetch(`${BASE_URL}/api/inquiries`, { 
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: content
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("문의 실패");
        return res;
    })
    .then(() => {
        alert("문의가 접수되었습니다!");
        document.getElementById("inquiryContent").value = "";
    })
    .catch(err => {
        console.error(err);
        alert("에러 발생");
    });
}

// 리뷰 목록에 닉네임 띄우기
function loadInquiries() {
    fetch(`${BASE_URL}/api/inquiries`)
        .then(res => res.json())
        .then(data => {
            const box = document.getElementById("inquiryList");

            box.innerHTML = data.map(i => `
            <div class="review-card">
                <strong>${i.nickname}</strong>
                <p>${i.content}</p>
                <small style="color: gray;">
                    ${i.createdAt ? i.createdAt.replace('T', ' ').substring(0,16) : ''}
                </small>
            </div>
        `).join("");
        });
}
</script>

</body>
</html>

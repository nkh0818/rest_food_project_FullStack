<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${area.name} + ' 상세정보'">상세정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex align-items-center mb-4">
        <a href="/food/list" class="btn btn-white shadow-sm rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
        <div>
            <h2 class="fw-bold mb-0" th:text="${area.name}">휴게소 이름</h2>
            <span class="text-muted" th:text="${area.routeName}">노선명</span>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-4"><i class="bi bi-list-stars text-success"></i> 추천 메뉴판</h4>
                            <a th:href="@{/events/list(stdRestCd=${area.stdRestCd},name=${area.name})}" >
                                이 휴게소의 이벤트/공지사항 확인하기
                            </a>
                        <!--
                                            asd
                        asd
                        
                        -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>메뉴명</th>
                                    <th class="text-end">가격</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="food : ${foods}">
                                    <td class="fw-bold" th:text="${food.foodName}">음식이름</td>
                                    <td class="text-end text-success fw-bold">
                                        <span th:text="${food.price > 0} ? ${#numbers.formatInteger(food.price, 0, 'COMMA') + '원'} : ' 직접 문의 '"></span>
                                    </td>
                                </tr>
                                <tr th:if="${foods.empty}">
                                    <td colspan="2" class="text-center py-4 text-muted">등록된 메뉴 정보가 없습니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    <div class="col-lg-4">
    <div class="card border-0 shadow-sm sticky-top" style="top: 20px; border-radius: 20px;">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-4"><i class="bi bi-fuel-pump-fill"></i> 주유소 정보</h5>
            
            <div th:if="${area.gasolinePrice != null && area.gasolinePrice > 0}">
                <div class="mb-3">
                    <span class="badge bg-dark px-3 py-2" th:text="${area.oilCompany}">정유사</span>
                </div>
                
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between px-2 py-3">
                        <span class="text-muted">휘발유</span>
                        <span class="fw-bold text-dark" th:text="${#numbers.formatInteger(area.gasolinePrice, 0, 'COMMA') + '원'}">0원</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between px-2 py-3">
                        <span class="text-muted">경유</span>
                        <span class="fw-bold text-dark" th:text="${area.diselPrice > 0 ? #numbers.formatInteger(area.diselPrice, 0, 'COMMA') + '원' : '-'}"></span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between px-2 py-3">
                        <span class="text-muted">LPG</span>
                        <span class="fw-bold text-dark" th:text="${area.lpgPrice > 0 ? #numbers.formatInteger(area.lpgPrice, 0, 'COMMA') + '원' : '-'}"></span>
                    </li>
                    <li class="list-group-item px-2 pt-4 border-0">
                        <div class="small text-muted mb-1">문의처</div>
                        <div class="fw-bold text-dark"><i class="bi bi-telephone"></i> <span th:text="${area.telNo}">010-0000-0000</span></div>
                    </li>
                </ul>
            </div>
            
            <div th:unless="${area.gasolinePrice != null && area.gasolinePrice > 0}" class="text-center py-5">
                <i class="bi bi-exclamation-circle text-muted display-4 mb-3"></i>
                <p class="text-muted small mb-0">해당 휴게소는 주유소 정보를<br>제공하지 않습니다.</p>
            </div>
        </div>
    </div>
</div>
    </div>
</div>
</body>
</html>

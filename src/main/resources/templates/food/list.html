<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴게소 맛집 & 주유 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .nav-pills .nav-link { border-radius: 50px; padding: 12px 30px; color: #666; transition: 0.3s; }
        .nav-pills .nav-link.active { background-color: #198754; box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3); }
        .card { border-radius: 15px; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .price-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #ddd; }
        .price-item:last-child { border-bottom: none; }
        .price-val { font-weight: 800; color: #d63384; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-5 fw-bold"><i class="bi bi-geo-alt-fill text-success"></i> 고속도로 스마트 가이드</h2>

    <div class="card mb-5 shadow-sm border-0 overflow-hidden" style="border-radius: 20px;">
        <div class="card-body p-4 bg-white">
            <form action="/food/list" method="get">
                <div class="row g-2">
                    <div class="col-md-5">
                        <input type="text" name="start" class="form-control form-control-lg border-0 bg-light" placeholder="출발지" th:value="${param.start}">
                    </div>
                    <div class="col-md-5">
                        <input type="text" name="end" class="form-control form-control-lg border-0 bg-light" placeholder="목적지" th:value="${param.end}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success btn-lg w-100">경로 찾기</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 shadow-sm" style="border-radius: 60px;">
        <li class="nav-item">
            <button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#rest-tab"><i class="bi bi-egg-fried"></i> 맛집 휴게소</button>
        </li>
        <li class="nav-item">
            <button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#gas-tab"><i class="bi bi-fuel-pump"></i> 최저가 주유소</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="rest-tab">
            <div class="row">
                <div class="col-md-4 mb-4" th:each="area : ${restAreas}">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="fw-bold mb-1" th:text="${area.name}">휴게소명</h5>
                            <span class="badge bg-success-subtle text-success mb-3" th:text="${area.routeName}">노선명</span>
                            <a th:href="@{/food/{id}(id=${area.id})}" class="btn btn-outline-success w-100">🍔 메뉴판 보기</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="gas-tab">
            <div class="row">
                <div class="col-md-4 mb-4" th:each="area : ${gasStations}">
                    <div class="card h-100 border-0 shadow-sm border-top border-4 border-primary">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold mb-0" th:text="${area.name}">주유소명</h5>
                                <span class="badge bg-primary" th:text="${area.oilCompany}">SK</span>
                            </div>
                            <div class="bg-light p-3 rounded-3 mb-3">
                                <div class="price-item"><span>휘발유</span><span class="price-val" th:text="${area.gasolinePrice > 0 ? #numbers.formatInteger(area.gasolinePrice, 0, 'COMMA') + '원' : '-'}"></span></div>
                                <div class="price-item"><span>경유</span><span class="price-val" th:text="${area.diselPrice > 0 ? #numbers.formatInteger(area.diselPrice, 0, 'COMMA') + '원' : '-'}"></span></div>
                                <div class="price-item"><span>LPG</span><span class="price-val text-warning" th:text="${area.lpgPrice > 0 ? #numbers.formatInteger(area.lpgPrice, 0, 'COMMA') + '원' : '-'}"></span></div>
                            </div>
                            <p class="small text-muted mb-0"><i class="bi bi-telephone"></i> <span th:text="${area.telNo}">010-0000-0000</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

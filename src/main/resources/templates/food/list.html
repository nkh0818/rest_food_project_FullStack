<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴게소 맛집 & 주유 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .nav-pills .nav-link { border-radius: 50px; padding: 12px 30px; color: #666; transition: 0.3s; }
        .nav-pills .nav-link.active { background-color: #198754; box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3); }
        .card { border-radius: 15px; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .price-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #ddd; }
        .price-item:last-child { border-bottom: none; }
        .price-val { font-weight: 800; color: #d63384; }
        .location-btn { position: absolute; right: 10px; top: 8px; z-index: 10; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-5 fw-bold"><i class="bi bi-geo-alt-fill text-success"></i> 고속도로 스마트 가이드</h2>

    <!-- 🔍 1. 일반 검색 폼 (휴게소 이름, 노선명 검색) -->
    <form action="/food/list" method="get" class="mb-4">
        <div class="input-group input-group-lg shadow-sm" style="border-radius: 20px; overflow: hidden;">
            <input type="text" name="search" class="form-control border-0 bg-white" 
                   placeholder="휴게소 이름이나 노선명" th:value="${search}">
            <button class="btn btn-success px-4 fw-bold" type="submit">
                <i class="bi bi-search"></i> 검색
            </button>
        </div>
    </form>

    <!-- 🗺️ 2. 경로 기반 탐색 폼 (카카오 API) -->
    <div class="card mb-5 shadow-sm border-0 overflow-hidden" style="border-radius: 20px;">
        <div class="card-header bg-success-subtle border-0 py-2">
            <span class="fw-bold text-success small"><i class="bi bi-signpost-split-fill"></i> 출발지~목적지 경로상의 휴게소 찾기</span>
        </div>
        <div class="card-body p-3 bg-white">
            <form action="/food/list" method="get" id="routeForm">
                <div class="row g-2">
                    <div class="col-md-5 position-relative">
                        <input type="text" id="startInput" name="start" class="form-control border-0 bg-light pe-5" 
                               placeholder="출발지 좌표 (경도,위도)" th:value="${param.start}">
                        <button type="button" class="btn btn-sm btn-outline-secondary location-btn" onclick="getMyLocation()">
                            <i class="bi bi-crosshair"></i> 내위치
                        </button>
                    </div>
                    <div class="col-md-5">
                        <input type="text" name="end" class="form-control border-0 bg-light" 
                               placeholder="목적지 좌표 (경도,위도)" th:value="${param.end}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-outline-success w-100 fw-bold">경로 찾기</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 탭 메뉴 -->
    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 shadow-sm" style="border-radius: 60px;" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="rest-tab-btn" data-bs-toggle="pill" data-bs-target="#rest-tab" type="button" role="tab" aria-controls="rest-tab" aria-selected="true">
                <i class="bi bi-egg-fried"></i> 맛집 휴게소
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="gas-tab-btn" data-bs-toggle="pill" data-bs-target="#gas-tab" type="button" role="tab" aria-controls="gas-tab" aria-selected="false">
                <i class="bi bi-fuel-pump"></i> 최저가 주유소
            </button>
        </li>
    </ul>

    <!-- 탭 컨텐츠 -->
    <div class="tab-content" id="myTabContent">
        
        <!-- 1. 맛집 휴게소 탭 -->
        <div class="tab-pane fade show active" id="rest-tab" role="tabpanel" aria-labelledby="rest-tab-btn">
            <div class="row">
                <!-- [수정됨] 비어있던 $ 기호를 ${} 로 변경 -->
                <div class="col-md-4 mb-4" th:each="area : ${restAreas}">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="fw-bold mb-1" th:text="${area.name}">휴게소명</h5>
                            <span class="badge bg-success-subtle text-success mb-3" th:text="${area.routeName}">노선명</span>
                            <a th:href="@{/food/{id}(id=${area.id})}" class="btn btn-outline-success w-100">🍔 메뉴판 보기</a>
                        </div>
                    </div>
                </div>
                
                <!-- 검색 결과가 없을 때 보여줄 문구 추가 -->
                <div class="col-12 text-center py-5 text-muted" th:if="${restAreas == null or restAreas.isEmpty()}">
                    <i class="bi bi-search display-4 d-block mb-3"></i>
                    조건에 맞는 휴게소가 없습니다.
                </div>
            </div>
        </div>

        <!-- 2. 최저가 주유소 탭 -->
        <div class="tab-pane fade" id="gas-tab" role="tabpanel" aria-labelledby="gas-tab-btn">
            
            <!-- [추가됨] 2단계: 주유소 유종 및 정렬 필터 영역 -->
            <form action="/food/list" method="get" class="mb-4 bg-white p-3 rounded-3 shadow-sm d-flex gap-3 align-items-center flex-wrap">
                <!-- 경로/검색어 유지 -->
                <input type="hidden" name="start" th:value="${param.start}">
                <input type="hidden" name="end" th:value="${param.end}">
                <input type="hidden" name="search" th:value="${param.search}">
                
                <div class="fw-bold text-success"><i class="bi bi-funnel-fill"></i> 주유소 필터</div>
                <select name="fuelType" class="form-select form-select-sm w-auto">
                    <option value="gasoline" th:selected="${fuelType == 'gasoline'}">휘발유</option>
                    <option value="diesel" th:selected="${fuelType == 'diesel'}">경유</option>
                    <option value="lpg" th:selected="${fuelType == 'lpg'}">LPG</option>
                </select>
                <select name="sortOrder" class="form-select form-select-sm w-auto">
                    <option value="asc" th:selected="${sortOrder == 'asc'}">최저가순</option>
                    <option value="desc" th:selected="${sortOrder == 'desc'}">최고가순</option>
                </select>
                <button type="submit" class="btn btn-sm btn-primary">적용하기</button>
            </form>

            <div class="row">
                <!-- [수정됨] 비어있던 $ 기호를 ${} 로 변경 -->
                <div class="col-md-4 mb-4" th:each="area : ${gasStations}">
                    <div class="card h-100 border-0 shadow-sm border-top border-4 border-primary">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold mb-0" th:text="${area.name}">주유소명</h5>
                                <span class="badge bg-primary" th:text="${area.oilCompany}">SK</span>
                            </div>
                            <div class="bg-light p-3 rounded-3 mb-3">
                                <div class="price-item">
                                    <span>휘발유</span>
                                    <span class="price-val" th:text="${area.gasolinePrice != null && area.gasolinePrice > 0 ? #numbers.formatInteger(area.gasolinePrice, 0, 'COMMA') + '원' : '-'}"></span>
                                </div>
                                <div class="price-item">
                                    <span>경유</span>
                                    <span class="price-val" th:text="${area.diselPrice != null && area.diselPrice > 0 ? #numbers.formatInteger(area.diselPrice, 0, 'COMMA') + '원' : '-'}"></span>
                                </div>
                                <div class="price-item">
                                    <span>LPG</span>
                                    <span class="price-val text-warning" th:text="${area.lpgPrice != null && area.lpgPrice > 0 ? #numbers.formatInteger(area.lpgPrice, 0, 'COMMA') + '원' : '-'}"></span>
                                </div>
                            </div>
                            <p class="small text-muted mb-0"><i class="bi bi-telephone"></i> <span th:text="${area.telNo}">010-0000-0000</span></p>
                        </div>
                    </div>
                </div>

                <!-- 검색 결과가 없을 때 보여줄 문구 추가 -->
                <div class="col-12 text-center py-5 text-muted" th:if="${gasStations == null or gasStations.isEmpty()}">
                    <i class="bi bi-droplet-half display-4 d-block mb-3"></i>
                    조건에 맞는 주유소가 없습니다.
                </div>
            </div>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- [추가됨] 3단계: 내 위치 가져오기 자바스크립트 -->
<script>
function getMyLocation() {
    // 브라우저가 위치 정보를 지원하는지 확인
    if (navigator.geolocation) {
        // 위치를 가져오는 동안 버튼 텍스트 변경
        const btn = document.querySelector('.location-btn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 찾는중...';
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(
            function(position) {
                // 카카오 네비 API는 경도(X), 위도(Y) 순서의 문자열을 요구합니다.
                let lat = position.coords.latitude;  // 위도 (Y)
                let lon = position.coords.longitude; // 경도 (X)
                
                // 소수점 5자리까지만 잘라서 깔끔하게 폼에 삽입
                document.getElementById('startInput').value = lon.toFixed(5) + "," + lat.toFixed(5);
                
                // 원상복구
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                alert("현재 내 위치 좌표가 설정되었습니다.");
            }, 
            function(error) {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                
                // 에러 처리
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        alert("사용자가 위치 정보 제공을 거부했습니다. 브라우저 설정에서 위치 권한을 허용해주세요.");
                        break;
                    case error.POSITION_UNAVAILABLE:
                        alert("위치 정보를 사용할 수 없습니다.");
                        break;
                    case error.TIMEOUT:
                        alert("위치 정보를 가져오는 데 시간이 초과되었습니다.");
                        break;
                    default:
                        alert("알 수 없는 오류가 발생했습니다.");
                        break;
                }
            },
            // 옵션: 높은 정확도 요구
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    } else {
        alert("현재 사용중인 브라우저에서는 위치 정보(GPS)를 지원하지 않습니다.");
    }
}

// 필터를 적용할 때, 주유소 탭을 유지하기 위한 스크립트 (UX 향상)
document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    // URL에 fuelType이나 sortOrder가 있으면(즉, 필터 버튼을 눌렀다면) 주유소 탭을 강제로 열어줍니다.
    if(urlParams.has('fuelType') || urlParams.has('sortOrder')) {
        var gasTabBtn = new bootstrap.Tab(document.getElementById('gas-tab-btn'));
        gasTabBtn.show();
    }
});
</script>
</body>
</html>

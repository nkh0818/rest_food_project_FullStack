<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고속도로 휴게소 이벤트 목록</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1> 휴게소 이벤트 목록</h1>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>휴게소명</th>
                <th>이벤트명</th>
                <th>기간</th>
                <th>조회수</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}">1</td>
                <td th:text="${event.stdRestNm}">휴게소</td>
                <td>
                    <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.eventNm}">이벤트 제목</a>
                </td>
                <td>
                    <span th:text="${event.stime}">시작일</span> ~ <span th:text="${event.etime}">종료일</span>
                </td>
                <td th:text="${event.viewCount}">0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

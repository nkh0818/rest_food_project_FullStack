<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이벤트 상세내용</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 50px auto; line-height: 1.6; color: #333; }
        .box { border: 1px solid #eee; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .title { font-size: 1.8em; margin-bottom: 10px; color: #2c3e50; }
        .info { font-size: 0.9em; color: #7f8c8d; margin-bottom: 20px; border-bottom: 1px dashed #ddd; padding-bottom: 15px; }
        .content { background: #fdfdfd; padding: 20px; border-radius: 8px; border-left: 5px solid #3498db; }
        .btn { display: inline-block; margin-top: 30px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <div class="title" th:text="${event.eventNm}">이벤트 제목</div>
        <div class="info">
            <span th:text="${event.stdRestNm}">휴게소이름</span> (<span th:text="${event.routeNm}">노선</span>) <br>
            기간: [[${event.stime}]] ~ [[${event.etime}]]
        </div>
        <div class="content" th:text="${event.eventDetail}">
            상세 내용이 출력됩니다.
        </div>
        <a href="/events" class="btn">목록으로 돌아가기</a>

    </div>
    
</body>
</html>

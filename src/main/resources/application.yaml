spring:
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:3306/rest_food_db?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 580000       # 10분 약간 안 되게 설정 (MySQL 연결 끊김 방지 핵심!)
      connection-timeout: 30000
      connection-test-query: SELECT 1  # 연결이 살아있는지 확인하는 쿼리

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # 파일 업로드 설정 (정확히 spring 바로 아래에 위치)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis 설정
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# AWS 설정 (spring 밖에 위치)
cloud:
  aws:
    s3:
      bucket: road-quest-img
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

# 로깅 설정
logging:
  level:
    com.yonsai.rest_food_project: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.type.descriptor.sql: trace

# 커스텀 설정들 (API 키 등)
road-service-key: ${ROAD_SERVICE_KEY}
YoutubeKey: asd
kakaoNaviKey: ${KAKAO_NAVI_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}
  client-secret: ${KAKAO_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}

nickname:
  adjectives: 배고픈,바삭한,졸린,질주하는,짭짤한
  nouns: 호두과자,소떡소떡,알감자,델리만쥬,통감자,오징어